name: macOS VNC Runner

on:
  workflow_dispatch:

jobs:
  macos-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Screen Sharing with VNC Password
        run: |
          # 1. Mat khau dung chuan 8 ky tu cho VNC legacy
          VNCPASS="Komura12"

          # 2. Ma hoa mat khau sang hex bang Perl theo chuan DES cua VNC
          HASH=$(perl -e '
            use strict;
            my $key = "\x17\x52\x6b\x06\x23\x4e\x58\x07";
            my $pw = substr($ARGV[0] . "\0" x 8, 0, 8);
            my @k = unpack("C*", $key);
            my @p = unpack("C*", $pw);
            my @res;
            for my $i (0..7) {
                push @res, sprintf("%02x", $p[$i] ^ $k[$i]);
            }
            print join("", @res);
          ' "$VNCPASS")

          # 3. Ghi hash mat khau truc tiep vao cau hinh he thong
          sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt VNCOn -bool TRUE
          sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt Password -data "$HASH"

          # 4. Kich hoat va cau hinh ARD Agent ho tro VNC legacy
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -restart -agent -privs -all

      - name: Connect Tailscale and Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "Vui long them Secret TAILSCALE_AUTHKEY vao Settings!"
            exit 1
          fi

          brew install tailscale
          sudo tailscaled install-system-daemon
          sleep 5

          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname="github-macos" --accept-routes
          
          TAILSCALE_IP=$(tailscale ip -4)

          echo "=========================================="
          echo "      THONG TIN DANG NHAP VNC APP         "
          echo "=========================================="
          echo "VNC Address : $TAILSCALE_IP:5900"
          echo "Password    : Komura12"
          echo "=========================================="

          MAX_SECONDS=21000
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            REMAINING=$(( (MAX_SECONDS - ELAPSED) / 60 ))
            echo "Runner is active... Remaining: $REMAINING minutes."
          done
