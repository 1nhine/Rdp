name: macOS VNC Runner

on:
  workflow_dispatch:

jobs:
  macos-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Setup Headless VNC Server
        run: |
          # 1. Tai phien ban OSXvnc (Vine Server) ho tro CLI headless cho macOS
          curl -sL -o osxvnc.tgz "https://raw.githubusercontent.com/redvdit/macos-rdp-server/main/OSXvnc-bin.tar.gz" || true
          
          # Neu khong co goi ngoai, su dung truc tiep script khoi tao Display ao va kich hoat VNC server goc
          # Dat password he thong bang cach ghi file hash MD5 chuan
          PASS="Komura12"
          
          # Kich hoat hien thi UI bang cach bat autologin cho tai khoan hien tai
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "runner"
          
          # Bat che do chia se man hinh voi day du quyen dieu khien
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner \
            -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$PASS" \
            -restart -agent

          # Mo khoa man hinh ao bang cach gia lap display qua phan mem
          brew install --cask betterdisplay || true

      - name: Connect Tailscale and Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "Vui long them Secret TAILSCALE_AUTHKEY vao Settings!"
            exit 1
          fi

          brew install tailscale
          sudo tailscaled install-system-daemon
          sleep 5

          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname="github-macos" --accept-routes
          
          TAILSCALE_IP=$(tailscale ip -4)

          echo "=========================================="
          echo "      THONG TIN DANG NHAP VNC APP         "
          echo "=========================================="
          echo "VNC Address : $TAILSCALE_IP"
          echo "Port        : 5900"
          echo "Username    : runner"
          echo "Password    : Komura12"
          echo "=========================================="

          MAX_SECONDS=21000
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            REMAINING=$(( (MAX_SECONDS - ELAPSED) / 60 ))
            echo "Runner is active... Remaining: $REMAINING minutes."
          done
