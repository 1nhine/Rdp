name: macOS VNC Runner

on:
  workflow_dispatch:

jobs:
  macos-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Setup Virtual Display and Native VNC Server
        run: |
          # 1. Cai dat tigervnc
          brew install tiger-vnc

          # 2. Tao thu muc cau hinh va thiet lap mat khau VNC dung 8 ky tu
          mkdir -p ~/.vnc
          echo "Komura12" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # 3. Khoi chay VNC server tao man hinh ao doc lap (khong bi loi man hinh den cua Apple)
          vncserver :1 -geometry 1280x800 -depth 24

      - name: Connect Tailscale and Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "Vui long them Secret TAILSCALE_AUTHKEY vao Settings!"
            exit 1
          fi

          brew install tailscale
          sudo tailscaled install-system-daemon
          sleep 5

          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname="github-macos" --accept-routes
          
          TAILSCALE_IP=$(tailscale ip -4)

          echo "=========================================="
          echo "      THONG TIN DANG NHAP VNC APP         "
          echo "=========================================="
          echo "VNC Address : $TAILSCALE_IP:5901"
          echo "Password    : Komura12"
          echo "=========================================="

          MAX_SECONDS=21000
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            REMAINING=$(( (MAX_SECONDS - ELAPSED) / 60 ))
            echo "Runner is active... Remaining: $REMAINING minutes."
          done
