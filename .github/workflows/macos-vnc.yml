name: macOS VNC Runner

on:
  workflow_dispatch:

jobs:
  macos-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Create VNC User and Enable Apple Screen Sharing
        run: |
          USERNAME="rdpuser"
          PASS="Komura@123"

          # 1. Tao tai khoan Admin moi hoan toan bang sysadminctl
          sudo sysadminctl -addUser "$USERNAME" -fullName "RDP Admin" -password "$PASS" -admin

          # 2. Bat Apple Remote Desktop / Screen Sharing cho tai khoan moi
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users "$USERNAME" \
            -privs -all \
            -restart -agent

          # 3. Kich hoat service Screen Sharing
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

      - name: Connect Tailscale and Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "Vui long them Secret TAILSCALE_AUTHKEY vao Settings!"
            exit 1
          fi

          brew install tailscale
          sudo tailscaled install-system-daemon
          sleep 5

          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname="github-macos" --accept-routes
          
          TAILSCALE_IP=$(tailscale ip -4)

          echo "=========================================="
          echo "      THONG TIN DANG NHAP VNC APP         "
          echo "=========================================="
          echo "Address  : $TAILSCALE_IP"
          echo "Port     : 5900"
          echo "Username : rdpuser"
          echo "Password : Komura@123"
          echo "=========================================="

          MAX_SECONDS=21000
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            REMAINING=$(( (MAX_SECONDS - ELAPSED) / 60 ))
            echo "Runner is active... Remaining: $REMAINING minutes."
          done
