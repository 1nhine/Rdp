name: macOS VNC Runner

on:
  workflow_dispatch:

jobs:
  macos-session:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure User Password and Enable Screen Sharing
        run: |
          PASS="Komura@123"

          # 1. Dat mat khau moi cho user runner ma khong can pass cu
          echo "runner:$PASS" | sudo chpasswd || sudo dscl . -create /Users/runner Password "$PASS"

          # 2. Bat dich vu Apple Remote Desktop / Screen Sharing
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner \
            -privs -all \
            -restart -agent

          # 3. Mo co mo ket noi VNC
          sudo defaults write /Library/Preferences/com.apple.VNCSettings.txt VNCOn -bool TRUE
          
          # 4. Kich hoat service Screen Sharing trong launchctl
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true

      - name: Connect Tailscale and Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "Vui long them Secret TAILSCALE_AUTHKEY vao Settings!"
            exit 1
          fi

          # Cai dat Tailscale bang Homebrew
          brew install tailscale
          sudo tailscaled install-system-daemon
          sleep 5

          # Ket noi Tailscale
          sudo tailscale up --authkey=$TAILSCALE_AUTHKEY --hostname="github-macos" --accept-routes
          
          TAILSCALE_IP=$(tailscale ip -4)

          echo "=========================================="
          echo "      THONG TIN DANG NHAP MAC VNC         "
          echo "=========================================="
          echo "VNC Address (IP:Port) : $TAILSCALE_IP:5900"
          echo "Username              : runner"
          echo "Password              : Komura@123"
          echo "=========================================="

          # Giu session online
          MAX_SECONDS=21000
          ELAPSED=0
          while [ $ELAPSED -lt $MAX_SECONDS ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            REMAINING=$(( (MAX_SECONDS - ELAPSED) / 60 ))
            echo "Runner is active... Remaining: $REMAINING minutes."
          done
