name: Windows RDP Runner

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Windows User and Configure RDP
        shell: powershell
        run: |
          # 1. Bat Remote Desktop va tat NLA de ket noi on dinh
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # Mo Firewall cho Remote Desktop
          New-NetFirewallRule -DisplayName "Allow RDP Custom" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. Thiet lap co dinh Username va Password
          $username = "rdpuser"
          $pass = "Komura@123"
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force

          # 3. Tao tai khoan va phan quyen Administrator
          New-LocalUser -Name $username -Password $secPass -FullName "RDP User" -Description "Runner Admin User"
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Connect Tailscale and Keep Alive
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: powershell
        run: |
          if (-not $env:TAILSCALE_AUTHKEY) {
              Write-Error "Vui long them Secret TAILSCALE_AUTHKEY vao Settings!"
              exit 1
          }

          Write-Host "Installing Tailscale..."
          winget install tailscale.tailscale --silent --accept-package-agreements --accept-source-agreements

          $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          
          Write-Host "Connecting to Tailscale..."
          & $tailscalePath up --authkey=$env:TAILSCALE_AUTHKEY --unattended --accept-routes --hostname="github-rdp"

          Start-Sleep -Seconds 5
          $tailscaleIp = (& $tailscalePath ip -4).Trim()

          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "      THONG TIN DANG NHAP WINDOWS APP     " -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "PC Name (IP) : $tailscaleIp" -ForegroundColor Yellow
          Write-Host "Username     : $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "Password     : $env:RDP_PASS" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green

          $maxSeconds = 21000
          $elapsed = 0
          while ($elapsed -lt $maxSeconds) {
              Start-Sleep -Seconds 60
              $elapsed += 60
              $remaining = [math]::Round(($maxSeconds - $elapsed) / 60)
              Write-Host "Runner is active... Remaining: $remaining minutes."
          }
