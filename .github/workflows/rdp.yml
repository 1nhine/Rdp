name: Windows RDP Runner

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360 # Thời gian tối đa của GitHub Actions (6 giờ)

    steps:
      - name: Configure RDP and Create User
        shell: powershell
        run: |
          # 1. Bật tính năng Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # 2. Tạo mật khẩu ngẫu nhiên an toàn (16 ký tự gồm chữ hoa, chữ thường, số và ký tự đặc biệt)
          $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()'
          $randomPassword = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          $username = "rdpuser"
          $secPassword = ConvertTo-SecureString $randomPassword -AsPlainText -Force

          # 3. Tạo tài khoản Windows và gán vào nhóm Administrators + Remote Desktop Users
          New-LocalUser -Name $username -Password $secPassword -FullName "RDP User" -Description "User for RDP Session"
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          # 4. Lưu lại thông tin credential cho các bước sau
          echo "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RDP_PASS=$randomPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify RDP Service and Network
        shell: powershell
        run: |
          # Kiểm tra trạng thái TermService
          $service = Get-Service -Name TermService
          Write-Host "Trạng thái RDP Service: $($service.Status)"
          if ($service.Status -ne 'Running') {
              Start-Service -Name TermService
          }

          # Lấy thông tin mạng nội bộ và IPv4 Public
          $publicIp = (Invoke-RestMethod -Uri "https://api.ipify.org")
          Write-Host "Runner Public IP (Outbound): $publicIp"

      - name: Setup Tunnel and Keep Runner Alive
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        shell: powershell
        run: |
          if (-not $env:NGROK_AUTH_TOKEN) {
              Write-Error "Vui lòng cấu hình Secret 'NGROK_AUTH_TOKEN' trong Repository Settings!"
              exit 1
          }

          # Tải và giải nén Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

          # Thiết lập xác thực Ngrok
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

          # Khởi chạy tunnel TCP trỏ tới cổng RDP 3389
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -PassThru
          Start-Sleep -Seconds 6

          # Lấy địa chỉ Host và Port công khai do Ngrok cấp
          $tunnels = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels").tunnels
          $publicUrl = $tunnels[0].public_url -replace "tcp://", ""
          $rdpHost = $publicUrl.Split(':')[0]
          $rdpPort = $publicUrl.Split(':')[1]

          # In bảng thông tin đăng nhập ra log
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "         THÔNG TIN KẾT NỐI RDP           " -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "Address/Host : $rdpHost"
          Write-Host "Port         : $rdpPort"
          Write-Host "Full Address : $publicUrl"
          Write-Host "Username     : $env:RDP_USER"
          Write-Host "Password     : $env:RDP_PASS"
          Write-Host "==========================================" -ForegroundColor Green

          # Giữ runner chạy liên tục (5 giờ 50 phút)
          $timeout = 21000
          $counter = 0
          while ($counter -lt $timeout) {
              Start-Sleep -Seconds 60
              $counter += 60
              $remaining = [math]::Round(($timeout - $counter) / 60)
              Write-Host "Runner đang chạy... Còn lại: $remaining phút."
          }
