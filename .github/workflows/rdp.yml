name: Windows RDP

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:

      - name: Windows information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "WINDOWS INFORMATION"
          Write-Host "======================================"

          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsArchitecture

          Write-Host ""
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "User:"
          whoami


      - name: Enable Remote Desktop
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "RDP_PASSWORD secret is missing."
            exit 1
          }

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          net user runneradmin "$env:RDP_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Could not set runneradmin password."
            exit 1
          }

          net localgroup "Remote Desktop Users" runneradmin /add

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 3

          Write-Host "RDP configuration completed."


      - name: Test RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP SERVICE"
          Write-Host "======================================"

          Get-Service TermService |
            Select-Object Status,Name,StartType

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP LISTENER"
          Write-Host "======================================"

          qwinsta

          Write-Host ""
          Write-Host "======================================"
          Write-Host "TCP 3389"
          Write-Host "======================================"

          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if ($rdp) {
            $rdp |
              Select-Object LocalAddress,
                            LocalPort,
                            State,
                            OwningProcess
          }
          else {
            Write-Warning "Nothing is listening on TCP 3389."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "LOCAL CONNECTION TEST"
          Write-Host "======================================"

          Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389


      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      - name: Tailscale information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "TAILSCALE"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "IPv4:"
          tailscale ip -4

          Write-Host ""
          Write-Host "Status:"
          tailscale status

          Write-Host ""
          Write-Host "Tailscale connectivity:"
          tailscale netcheck


      - name: Show RDP information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "WINDOWS RDP INFORMATION"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          tailscale ip -4

          Write-Host ""
          Write-Host "Username:"
          Write-Host ".\runneradmin"

          Write-Host ""
          Write-Host "RDP Port:"
          Write-Host "3389"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "KEEP RUNNER RUNNING"
          Write-Host "======================================"


      - name: Keep Windows running
        shell: powershell
        run: |
          while ($true) {
            Write-Host "Runner is still running: $(Get-Date)"
            Start-Sleep -Seconds 60
          }
