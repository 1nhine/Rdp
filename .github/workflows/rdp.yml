name: Windows RDP Runner

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP and Create User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()'
          $randomPassword = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })

          $username = "rdpuser"
          $secPassword = ConvertTo-SecureString $randomPassword -AsPlainText -Force

          New-LocalUser -Name $username -Password $secPassword -FullName "RDP User" -Description "User for RDP Session"
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RDP_PASS=$randomPassword" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify RDP Service and Network
        shell: powershell
        run: |
          $service = Get-Service -Name TermService
          Write-Host "TermService Status: $($service.Status)"
          if ($service.Status -ne 'Running') {
              Start-Service -Name TermService
          }

          $publicIp = (Invoke-RestMethod -Uri "https://api.ipify.org")
          Write-Host "Runner Public IP: $publicIp"

      - name: Setup Tunnel and Keep Runner Alive
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        shell: powershell
        run: |
          if (-not $env:NGROK_AUTH_TOKEN) {
              Write-Error "Secret NGROK_AUTH_TOKEN is missing!"
              exit 1
          }

          # Tai va giai nen Ngrok
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

          # Cau hinh authtoken
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN

          # Chay ngrok background service
          Start-Process powershell -ArgumentList "-NoExit", "-Command", ".\ngrok.exe tcp 3389"

          # Vong lap cho API ngrok khoi dong thanh cong
          $maxRetries = 15
          $retryCount = 0
          $publicUrl = ""

          while ($retryCount -lt $maxRetries) {
              Start-Sleep -Seconds 3
              try {
                  $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                  if ($response.tunnels.Count -gt 0) {
                      $publicUrl = $response.tunnels[0].public_url -replace "tcp://", ""
                      break
                  }
              } catch {
                  # API chua san sang, tiep tuc doi
              }
              $retryCount++
          }

          if (-not $publicUrl) {
              Write-Error "Could not retrieve Ngrok tunnel URL. Please check your Authtoken."
              exit 1
          }

          $rdpHost = $publicUrl.Split(':')[0]
          $rdpPort = $publicUrl.Split(':')[1]

          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "         RDP CONNECTION DETAILS           " -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "Address/Host : $rdpHost"
          Write-Host "Port         : $rdpPort"
          Write-Host "Full Address : $publicUrl"
          Write-Host "Username     : $env:RDP_USER"
          Write-Host "Password     : $env:RDP_PASS"
          Write-Host "==========================================" -ForegroundColor Green

          # Giu session chay
          $timeout = 21000
          $counter = 0
          while ($counter -lt $timeout) {
              Start-Sleep -Seconds 60
              $counter += 60
              $remaining = [math]::Round(($timeout - $counter) / 60)
              Write-Host "Runner alive... Remaining: $remaining minutes."
          }
