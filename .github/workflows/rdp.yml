name: Windows RDP Runner

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup Windows User and RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$'
          $pass = -join ((1..14) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          $username = "rdpuser"
          $secPass = ConvertTo-SecureString $pass -AsPlainText -Force

          New-LocalUser -Name $username -Password $secPass -FullName "RDP User"
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          echo "RDP_USER=$username" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Start TCP Tunnel and Show Credentials
        shell: powershell
        run: |
          # Tao tunnel TCP thong qua serveo.net
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 serveo.net > tunnel.log 2>&1" -PassThru
          
          $targetHost = ""
          $targetPort = ""
          for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path "tunnel.log") {
                  $content = Get-Content "tunnel.log" -Raw
                  if ($content -match "Forwarding TCP traffic from (.*?):(\d+)") {
                      $targetHost = $matches[1]
                      $targetPort = $matches[2]
                      break
                  }
              }
          }

          if (-not $targetPort) {
              Write-Host "Kenh Serveo ban, thu cong cu tunnel du phong..."
              Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
              Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
              Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -PassThru -RedirectStandardOutput "ngrok.log"
              Start-Sleep -Seconds 6
              $log = Get-Content "ngrok.log" -Raw
              if ($log -match "url=tcp://(.*?):(\d+)") {
                  $targetHost = $matches[1]
                  $targetPort = $matches[2]
              }
          }

          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "      THONG TIN DANG NHAP WINDOWS APP     " -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "PC Name (IP:Port) : $targetHost`:$targetPort" -ForegroundColor Yellow
          Write-Host "Username          : $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "Password          : $env:RDP_PASS" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green

          # Giu session online
          $maxSeconds = 21000
          $elapsed = 0
          while ($elapsed -lt $maxSeconds) {
              Start-Sleep -Seconds 60
              $elapsed += 60
              $remaining = [math]::Round(($maxSeconds - $elapsed) / 60)
              Write-Host "Runner is active... Remaining: $remaining minutes."
          }
